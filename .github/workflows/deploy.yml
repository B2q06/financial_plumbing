# Deploy to giant on every push to `production`.
# Runs on the self-hosted runner installed on giant (label: giant), so nothing has to reach giant from outside:
# the runner polls GitHub. The checkout at /home/b/financial_plumbing holds .env and is what compose runs from.
name: deploy

on:
  push:
    branches: [production]

concurrency:
  group: deploy-giant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, giant]
    defaults:
      run:
        working-directory: /home/b/financial_plumbing
    steps:
      - name: pull production
        run: |
          git fetch origin production
          git checkout production
          git reset --hard origin/production
          git log -1 --format='%h %s'
      - name: build images
        run: docker compose build
      - name: restart services
        run: |
          docker compose up -d
          docker compose ps --format '{{.Service}}: {{.Status}}'
      - name: smoke test
        run: |
          sleep 5
          docker compose exec -T scheduler /usr/local/bin/supercronic -test /app/deploy/crontab
          curl -sf "http://localhost:8000/series/SPY?start=2026-09-01" | head -c 120; echo
          docker compose exec -T postgres psql -U plumbing -d plumbing -c "SELECT count(*) FROM security"
