services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plumbing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: plumbing
    ports:
      - "8888:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumbing -d plumbing"]
      interval: 5s 
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

  scheduler:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      PG_DSN: postgresql://plumbing:${POSTGRES_PASSWORD}@postgres:5432/plumbing
    volumes:
      - /home/b/projects/regime-change/data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "plumbing.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATA_DIR: /data
      PG_DSN: postgresql://plumbing:${POSTGRES_PASSWORD}@postgres:5432/plumbing
    ports:
      - "8000:8000"
    volumes:
      - /home/b/projects/regime-change/data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
