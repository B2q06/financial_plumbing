services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plumbing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: plumbing
    ports:
      - "8888:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumbing -d plumbing"]
      interval: 5s 
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
