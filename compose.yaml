name: fp

services:
  scheduler:
    build: .
    container_name: fp-scheduler
    env_file: .env
    environment:
      TZ: America/Chicago
      DATA_DIR: /data
      PG_DSN: postgresql://fp:${POSTGRES_PASSWORD}@db-postgres:5432/fp
    volumes:
      - ${DATA_DIR}:/data
    networks: [default, db]
    restart: unless-stopped

  api:
    build: .
    container_name: fp-api
    command: ["uvicorn", "plumbing.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATA_DIR: /data
      PG_DSN: postgresql://fp:${POSTGRES_PASSWORD}@db-postgres:5432/fp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${DATA_DIR}:/data
    networks: [default, db]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u;
      u.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: fp-net
  db:
    name: db-net
    external: true
